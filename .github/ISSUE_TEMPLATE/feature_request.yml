name: Feature request
description: Propose a feature with clear context, constraints, and acceptance criteria
title: 'feat(<scope>): As a <role> I would like to '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please structure feature requests with the same rigor as implementation tickets.

        Keep the title in user-story format and provide concrete acceptance criteria.

  - type: textarea
    id: metadata
    attributes:
      label: 'Context: Metadata'
      description: Include workflow metadata and constraints the implementation must follow.
      placeholder: |
        **IMPORTANT**: _ALWAYS_ verify dev environment metadata first.

        ```yml
        pull_request_title: "FROM feat/[issue#]-[shortdesc] TO development"
        branch: "feat/[issue#]-[shortdesc]"
        worktree_path: "$WORKSPACE/.worktrees/feat-[issue#]"
        ```
    validations:
      required: true

  - type: textarea
    id: user_stories
    attributes:
      label: User Stories
      description: Define the feature as user stories. This section should drive implementation scope.
      placeholder: |
        - As a user, I would like to ..., so that ...
        - As an admin, I would like to ..., so that ...
    validations:
      required: true

  - type: textarea
    id: documentation
    attributes:
      label: Documentation
      description: Add links to references, standards, or examples that should guide implementation.
      placeholder: |
        - https://...
        - https://...
    validations:
      required: false

  - type: textarea
    id: integration_points
    attributes:
      label: Key Integration Points
      description: Identify files, folders, modules, or interfaces that must be introduced or changed.
      placeholder: |
        - Create/update `...`
        - Integrate with `...`
    validations:
      required: true

  - type: textarea
    id: development_setup
    attributes:
      label: Development Setup
      description: List command expectations and environment setup notes.
      placeholder: |
        _READ_ the `package.json` scripts.
        Commands:
        - npm run lint
        - npm test
    validations:
      required: false

  - type: textarea
    id: design_principles
    attributes:
      label: Design Principles
      description: Capture the implementation principles that should drive decisions.
      placeholder: |
        - Simplicity is beauty, complexity is pain.
        - _ALWAYS_ minimize changes while maximizing maintainability.
        - Prefer a TDD-oriented workflow where practical.
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define measurable completion conditions.
      placeholder: |
        - [ ] Implementation plan is documented.
        - [ ] Existing and new tests pass.
        - [ ] CLI behavior is validated manually.
        - [ ] Documentation reflects latest changes.
    validations:
      required: true
