name: Bug report
description: Report a bug using user stories to describe broken behavior and impact
title: 'bug(<scope>): As a <role> when I <action>, <broken behavior> happens'
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please describe bugs with user stories first, then provide reproduction details.

        This keeps impact, expected behavior, and implementation scope clear.

  - type: textarea
    id: metadata
    attributes:
      label: 'Context: Metadata'
      description: Include workflow metadata and constraints for a clean implementation flow.
      placeholder: |
        **IMPORTANT**: _ALWAYS_ verify dev environment metadata first.

        ```yml
        pull_request_title: "FROM bug/[issue#]-[shortdesc] TO development"
        branch: "bug/[issue#]-[shortdesc]"
        worktree_path: "$WORKSPACE/.worktrees/bug-[issue#]"
        ```
    validations:
      required: true

  - type: textarea
    id: broken_user_stories
    attributes:
      label: Broken User Stories
      description: Define how the system is broken using user stories.
      placeholder: |
        - As a user, when I ..., ... happens instead of ...
        - As an admin, when I ..., ... fails and I cannot ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: Describe the correct behavior for each broken story.
      placeholder: |
        - When ..., the CLI should ...
        - The system should not ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Provide deterministic steps to reproduce the bug.
      placeholder: |
        1. Run `...`
        2. Execute `...`
        3. Observe `...`
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain severity, who is affected, and current workaround (if any).
      placeholder: |
        - Severity: High/Medium/Low
        - Affected users: ...
        - Workaround: ...
    validations:
      required: true

  - type: input
    id: cli_version
    attributes:
      label: CLI Version
      description: Which CLI version are you running?
      placeholder: 'e.g. 0.1.7'
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define measurable conditions that confirm the bug is fixed.
      placeholder: |
        - [ ] Root cause is identified and documented.
        - [ ] Existing and new tests pass.
        - [ ] Bug scenario is validated manually in CLI.
        - [ ] Related documentation is updated.
    validations:
      required: true
